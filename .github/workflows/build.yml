name: Build and test

on:
  push:
    branches: [main, 'optimize/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }
      - name: Check Rust lints
        shell: pwsh
        run: cargo clippy -p apd-core --locked --all-targets -- -D warnings
      - name: Build Rust, run regressions, and build WinUI
        shell: pwsh
        run: ./scripts/build.ps1
