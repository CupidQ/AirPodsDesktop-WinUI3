name: WinUI 3 build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Ensure installer compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build, test, and package self-contained installer
        shell: pwsh
        run: ./build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AirPodsDesktop-WinUI3-Setup-x64
          path: |
            dist/*-Setup-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
