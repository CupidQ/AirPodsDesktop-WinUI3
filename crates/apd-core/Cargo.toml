[package]
name = "apd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AirPodsDesktop core: Apple Continuity Protocol, BLE scanning, state management"

[lib]
name = "apd_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
log = "0.4"
once_cell = "1.19"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "System",
    "Win32_Foundation",
    "Win32_System_WinRT",
]

[dev-dependencies]
